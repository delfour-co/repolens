<!DOCTYPE html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% if lang == 'fr' %}Un auto-configurateur CLI pour les dépôts GitHub et GitLab.{% else %}{{ config.description }}{% endif %}" />
    <meta property="og:title" content="{{ config.title }}" />
    <meta property="og:description" content="{% if lang == 'fr' %}Un auto-configurateur CLI pour les dépôts GitHub et GitLab.{% else %}{{ config.description }}{% endif %}" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="{{ get_url(path='img/og.jpg') }}" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="{{ get_url(path='favicon.png') }}" />
    <link rel="stylesheet" href="{{ get_url(path='main.css') }}" />
  </head>
  <body>
    {% block content %}{% endblock content %}
    <footer>
      🛡️ RepoLens — auto-configurator for GitHub &amp; GitLab · MIT OR Apache-2.0 ·
      <a href="{{ config.extra.repo_url }}">GitHub</a>
    </footer>
  </body>
</html>
