name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Generate coverage report
        # issues.rs and metadata.rs invoke the `gh` CLI at runtime, so their
        # branches are unreachable in CI without GitHub auth — exclude them
        # from the coverage gate alongside the existing GitHub-API rules.
        run: cargo tarpaulin --all-features --out Xml --output-dir coverage --exclude-files 'crates/repolens/src/main.rs' --exclude-files 'crates/repolens-core/src/lib.rs' --exclude-files 'crates/repolens/tests/**' --exclude-files 'crates/repolens/src/cli/commands/**' --exclude-files 'crates/repolens-core/src/providers/**' --exclude-files 'crates/repolens-core/src/actions/branch_protection.rs' --exclude-files 'crates/repolens-core/src/actions/github_settings.rs' --exclude-files 'crates/repolens-core/src/actions/git.rs' --exclude-files 'crates/repolens-core/src/actions/planner.rs' --exclude-files 'crates/repolens-core/src/rules/categories/dependencies.rs' --exclude-files 'crates/repolens-core/src/rules/categories/codeowners.rs' --exclude-files 'crates/repolens-core/src/rules/categories/security.rs' --exclude-files 'crates/repolens-core/src/rules/categories/issues.rs' --exclude-files 'crates/repolens-core/src/rules/categories/metadata.rs' --exclude-files 'crates/repolens-core/src/utils/prerequisites.rs' --exclude-files 'crates/repolens-core/src/rules/categories/custom.rs' --no-fail-fast --fail-under 90 -- --skip e2e_
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/cobertura.xml
          fail_ci_if_error: false

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install security tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
      - name: Run cargo audit
        run: cargo audit
      - name: Run cargo deny
        run: cargo deny check advisories licenses

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify package metadata
        run: |
          cargo metadata --no-deps --format-version 1 | python3 -c "
          import sys, json;
          packages = {p['name']: p for p in json.load(sys.stdin)['packages']};
          # readme is only required on the published binary crate; repolens-core
          # is a library with no README of its own.
          checks = {
              'repolens': ['description', 'license', 'repository', 'readme'],
              'repolens-core': ['description', 'license', 'repository'],
          };
          errors = [];
          for name, required in checks.items():
              meta = packages.get(name);
              if meta is None:
                  errors.append(f'Missing package: {name}');
                  continue;
              missing = [f for f in required if not meta.get(f)];
              if missing:
                  errors.append(f'{name}: missing Cargo.toml fields: {missing}');
          assert not errors, '; '.join(errors);
          print('All required crates.io metadata fields are present')
          "
      # cargo publish --dry-run validates the package end-to-end (list + build
      # in a temp dir). --allow-dirty bypasses the clean-working-dir check that
      # cargo applies after re-resolving the registry index against Cargo.lock.
      # --workspace publishes repolens-core and repolens together (stabilized
      # in Cargo 1.90): Cargo topologically orders the two crates and
      # verifies repolens' build against a local registry overlay containing
      # the freshly-packaged repolens-core. A plain `cargo publish -p repolens
      # --dry-run` would fail here because repolens-core isn't on crates.io
      # under its current name/version yet — the registry has no way to
      # resolve the path+version dependency on its own.
      - name: Dry-run publish (workspace)
        run: cargo publish --workspace --dry-run --allow-dirty
